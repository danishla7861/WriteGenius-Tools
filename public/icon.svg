<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4776FF" />
      <stop offset="100%" stop-color="#8957FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with dark navy and border -->
  <rect width="512" height="512" rx="128" fill="#070B14" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0D1424" stroke="#263653" stroke-width="8" />
  
  <!-- Glowing icon container -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#wg_grad)" filter="url(#glow)" />
  
  <!-- Pen Tool & Sparkle Symbol in Center -->
  <g transform="translate(156, 156)" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Feather / Pen Nib -->
    <path d="M100 20 L160 80 L60 180 L20 180 L20 140 Z" fill="#FFFFFF" fill-opacity="0.15" />
    <path d="M120 40 L60 100" />
    <circle cx="60" cy="100" r="10" fill="#FFFFFF" />
    <path d="M60 100 L20 140" />
    
    <!-- Sparkles -->
    <path d="M160 140 L168 156 L184 164 L168 172 L160 188 L152 172 L136 164 L152 156 Z" fill="#FFFFFF" stroke="none" />
    <path d="M40 30 L45 42 L57 47 L45 52 L40 64 L35 52 L23 47 L35 42 Z" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
