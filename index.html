    <script>
      // Gracefully silence Vite HMR WebSocket errors in cloud/iframe environments
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);
          window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && (String(e.reason).indexOf('WebSocket') !== -1 || String(e.reason?.stack).indexOf('@vite/client') !== -1)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
          if (window.WebSocket) {
            var OriginalWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('vite') !== -1)) {
                return {
                  url: url,
                  readyState: 3, // CLOSED
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null
                };
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }
      })();
    </script>

    <!-- Prevent dark mode theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wg_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
